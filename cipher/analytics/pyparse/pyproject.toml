[project]
name = "pyparse"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cipher-schemas",
    "cipher-utils",
    "filetyper",
    "loguru",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }
filetyper = { workspace = true }

[project.optional-dependencies]
html = ["beautifulsoup4", "cssutils", "lxml"]
eml = ["chardet", "pyparse[html]"]
msg = ["compressed-rtf", "msg-parser", "pyparse[eml]"]
email = ["pyparse[eml,msg]"]
contacts = ["phonenumbers", "python-dateutil", "vobject"]
all = ["pyparse[contacts,email]"]


[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
