[project]
name = "filetyper"
description = "A repository for filetyping using Google's AIML-based approach Magika and custom heuristics."
keywords = ["filetyping", "magika", "heuristics", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
dependencies = [
  "magika",
  "loguru",
  "filetype",
  "cipher-schemas",
  "tqdm",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]
# See through these compressions too (gzip, bzip2 and xz are stdlib). zstd is the PEP 784 backport (stdlib on 3.14).
zstd = [ "backports.zstd" ]
lz4 = [ "lz4" ]
# Tell a PDF that needs a password from one only locked against editing.
pdf = [ "pypdfium2" ]

[project.scripts]
filetyper-api = "filetyper.api.main:main"