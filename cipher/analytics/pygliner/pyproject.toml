[project]
name = "pygliner"
description = "Zero-shot multilingual entity and relation extraction (GLiNER + GLiREL) for the CIPHER entity layer."
keywords = ["ner", "relation-extraction", "gliner", "glirel", "zero-shot", "multilingual", "cipher"]
version = "0.0.1"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "gliner",
  "loguru",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygliner"]

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]
relations = [ "glirel" ]
cpu = [ "torch" ]
cuda = [ "torch" ]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[project.scripts]
pygliner-api = "pygliner.api.main:main"
