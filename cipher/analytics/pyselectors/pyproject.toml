[project]
name = "pyselectors"
description = "Deterministic extraction and normalization of strong selectors (phone, email, IBAN, IMEI, passport) from text."
keywords = ["selectors", "entity-resolution", "phone", "email", "iban", "imei", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "loguru",
  "phonenumbers",
  "python-stdnum",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyselectors"]

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]

[project.scripts]
pyselectors-api = "pyselectors.api.main:main"
