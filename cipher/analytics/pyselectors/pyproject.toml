[project]
name = "pyselectors"
description = "Multilingual, context-scored extraction, normalization and validation of strong selectors (phone, email, IP, IBAN, IMEI, crypto addresses, social handles) from text."
keywords = ["selectors", "entity-resolution", "phone", "email", "ip", "iban", "imei", "crypto", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "loguru",
  "mrz>=0.6.2",
  "phonenumbers",
  "pycryptodome>=3.23.0",
  "python-stdnum",
  "regex",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyselectors"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyselectors/packs/data" = "pyselectors/packs/data"

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]

[project.scripts]
pyselectors-api = "pyselectors.api.main:main"
