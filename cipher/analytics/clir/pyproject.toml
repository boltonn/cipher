[project]
name = "clir"
description = "A repository for multilingual text embedding."
keywords = [ 
    "feature-extraction", 
    "multilingual", 
    "nlp", 
    "text-embedding" 
]

version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "langchain-text-splitters",
  "loguru",
  "peft",
  "sentence-transformers",
  "torch",
  "tqdm"
]

[tool.uv.sources]
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]
eval = [ "mteb" ]
cpu = ["torch"]
cuda = ["torch"]
flash = ["flash-attn"]
tables = [ "fastparquet", "pandas", "polars", "pyarrow", "typer" ]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[project.scripts]
clir-api = "clir.api.main:main"