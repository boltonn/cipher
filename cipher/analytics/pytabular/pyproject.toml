[project]
name = "pytabular"
description = "Memory-safe profiling of messy tabular files (csv/tsv/xlsx/parquet/jsonl) and column typing onto the CIPHER ontology."
keywords = ["tabular", "csv", "excel", "parquet", "column-typing", "schema-mapping", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
]
dependencies = [
  "charset-normalizer",
  "cipher-names",
  "cipher-places",
  "cipher-schemas",
  "httpx",
  "loguru",
  "polars",
  "pyarrow",
  "pyselectors",
  "python-calamine",
  "pyyaml",
]

[tool.uv.sources]
cipher-names = { workspace = true }
cipher-places = { workspace = true }
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }
pyselectors = { workspace = true }
pyprompt = { workspace = true }
pygliner = { workspace = true }
nerd = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytabular"]

[tool.hatch.build.targets.wheel.force-include]
"src/pytabular/data" = "pytabular/data"

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]
llm = [ "pyprompt" ]
gliner = [ "pygliner" ]
nerd = [ "nerd" ]

[project.scripts]
pytabular-api = "pytabular.api.main:main"
