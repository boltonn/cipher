[project]
name = "pyocr"
description = "Multilingual page OCR (PDF + images, incl. HEIF) via vision-language OCR models, jina-ocr-v1 by default."
keywords = ["ocr", "document-parsing", "multilingual", "vllm", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "httpx",
  "loguru",
  "pillow",
  "pillow-heif",
  "pydantic>=2",
  "pydantic-settings",
  "pypdfium2",
  "typer",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyocr"]

# vLLM (the fast FastMTP path) pins its own torch/transformers, so it is not an
# extra here -- it would force the whole workspace lock onto its torch. Install it
# into the service's own venv instead: `make install-vllm`.
[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]
transformers = [
  "huggingface-hub",
  "torch",
  "torchvision",
  "transformers>=4.57,<5",
]

[project.scripts]
pyocr-api = "pyocr.api.main:main"
pyocr = "pyocr.cli:app"
