[project]
name = "pyocr"
description = "Page OCR for PDFs and images: jina-ocr-v1 (GPU, via pyvllm's local vLLM server) or Indra OCR (CPU, in-process)."
keywords = ["ocr", "multilingual", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "httpx",
  "pillow",
  "pillow-heif",
  "pydantic>=2",
  "pypdfium2",
  "pyvllm",
]

[project.optional-dependencies]
# Indra OCR runs in this process on CPU (ONNX Runtime), no server: `pyocr.indra`.
indra = ["indra-ocr>=1.1.2"]

[tool.uv.sources]
cipher-schemas = { workspace = true }
pyvllm = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyocr"]
