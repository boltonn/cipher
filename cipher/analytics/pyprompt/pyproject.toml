[project]
name = "pyprompt"
description = "LLM prompt-runner for structured extraction over text (NER + relations, events, custom prompts) for CIPHER."
keywords = ["llm", "openai", "structured-output", "ner", "relation-extraction", "event-extraction", "cipher"]
version = "0.0.1"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "jinja2",
  "loguru",
  "openai",
  "pydantic>=2",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyprompt"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyprompt/prompts" = "pyprompt/prompts"

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]

[project.scripts]
pyprompt-api = "pyprompt.api.main:main"
