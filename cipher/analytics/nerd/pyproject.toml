[project]
name = "nerd"
description = "Supervised multilingual NER (transformers token classification) training + inference for the CIPHER entity layer."
keywords = ["ner", "named-entity-recognition", "transformers", "token-classification", "multilingual", "cipher"]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
  "cipher-schemas",
  "loguru",
  "python-iso639",
  "transformers",
]

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nerd"]

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]
cpu = [ "torch" ]
cuda = [ "torch" ]
train = [
  "accelerate",
  "datasets",
  "huggingface-hub",
  "peft",
  "seqeval",
  "typer",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[project.scripts]
nerd-api = "nerd.api.main:main"
