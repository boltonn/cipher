[project]
name = "pyxberg"
description = "A repository for Xberg (formerly Kreuzberg) rust-based python text extraction."
keywords = ["chunking", "ocr", "text-embedding", "text-extraction"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
dependencies = [
  "xberg",
  "kreuzberg[easyocr]",
  "loguru",
  "pydantic",
  "typer",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project.optional-dependencies]
fastapi = [ "cipher-utils[fastapi]" ]

[project.scripts]
pyxberg-api = "pyxberg.api.main:main"
pyxberg = "pyxberg.cli:app"

[tool.uv.sources]
cipher-utils = { workspace = true }
