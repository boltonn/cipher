[project]
name = "cipher"
version = "0.0.1"
description = "A monorepo for all things cipher."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cipher-names",
    "cipher-places",
    "cipher-schemas",
    "cipher-utils",
]

[project.optional-dependencies]
analytics-cpu = [ "clir", "face", "filetyper[zstd,lz4,pdf]", "pyarchive[zstd,lz4,pdf]", "nerd", "pygliner", "pyprompt", "pyvllm", "pyparse[all]", "pyselectors", "pytabular", "pyxberg", "setfitcv" ]
analytics-cuda = [ "clir[cuda,tables]", "face[cuda]", "filetyper[zstd,lz4,pdf]", "pyarchive[zstd,lz4,pdf]", "nerd[cuda]", "pygliner[cuda]", "pyprompt", "pyvllm", "pyparse[all]", "pyselectors", "pytabular", "pyxberg", "setfitcv[cuda]" ]
elasticsearch = [ "cipher-datastores[elasticsearch]" ]
postgres = [ "cipher-datastores[postgres]" ]
backend = [ "cipher-backend" ]
orchestration = [ "cipher-orchestration[cli]" ]
all-cuda = [
    "cipher[analytics-cuda]",
    "cipher[backend]",
    "cipher[elasticsearch]",
    "cipher[postgres]",
    "cipher[orchestration]"
]

[tool.uv.sources]
cipher-datastores = { workspace = true }
cipher-names = { workspace = true }
cipher-places = { workspace = true }
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }
cipher-backend = { workspace = true }
cipher-orchestration = { workspace = true }
face = { workspace = true }
filetyper = { workspace = true }
setfitcv = { workspace = true }
pyparse = { workspace = true }
pyxberg = { workspace = true }
pyarchive = { workspace = true }
pyvllm = { workspace = true }
pyselectors = { workspace = true }
pytabular = { workspace = true }
pygliner = { workspace = true }
pyprompt = { workspace = true }
nerd = { workspace = true }
clir = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/cipher-datastores",
    "libs/cipher-names",
    "libs/cipher-places",
    "libs/cipher-schemas",
    "libs/cipher-utils",
    "pipelines/cipher-orchestration",
    "backend",
    "analytics/clir",
    "analytics/face",
    "analytics/filetyper",
    "analytics/nerd",
    "analytics/pygliner",
    "analytics/pyvllm",
    "analytics/pyprompt",
    "analytics/pyselectors",
    "analytics/pytabular",
    "analytics/setfitcv",
    "analytics/pyparse",
    "analytics/pyxberg",
    "analytics/pyarchive",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_version == '3.12'",
]
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "setuptools", "wheel", "ninja"]

[dependency-groups]
dev = [
    "alembic",
    "debugpy",
    "faker",
    "httpx",
    "psutil",
    "pytest",
    "pytest-asyncio",
    "pytest-loguru",
    "ruff",
    "ty",
    "setuptools",
    "wheel",
    "ninja",
]

[tool.ruff]
line-length = 120
# migrations: alembic scripts; nerd/data: vendored NER dataset processors.
extend-exclude = ["**/migrations/**", "analytics/nerd/src/nerd/data/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

ignore = [
  "E501",
  "D100",
  "D101",
  "D104",
  "D107",
  "D203",
  "D213",
  "D401",
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# test names say what they check
"**/tests/**" = ["D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["cipher"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    "**/scripts/**",
    "**/tests/**",
    "**/.venv/**",
]

[tool.ty.rules]
# Pre-existing backlog (~470 diagnostics at adoption on 2026-08-28); the CI `ty`
# job is non-blocking until this is burned down. Tighten to a gate once green.
unresolved-import = "warn"
unresolved-attribute = "warn"
invalid-parameter-default = "warn"