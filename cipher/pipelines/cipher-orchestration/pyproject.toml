[project]
name = "cipher-orchestration"
version = "0.0.1"
description = "Workflow orchestration for cipher."
requires-python = ">=3.12"

dependencies = [
    "anyio",
    "cipher-schemas",
    "cipher-datastores[postgres,elasticsearch]",
    "cipher-places",
    "cipher-utils[aws]",
    "loguru",
    "pyprompt",
    "pyselectors",
    "tqdm",
    "typer",
]

# One extra per stage: `ensure_stage_env` (environments.py) re-launches a command
# under `uv run --extra <stage>`, so an environment only holds the analytics it has
# actually run. Names follow the enrichment type they serve.
[project.optional-dependencies]
staging = ["filetyper[zstd,lz4,pdf]"]
archive-extraction = ["pyarchive[zstd,lz4,pdf]"]
text-extraction = ["pyxberg", "pyparse[email]"]
ocr = ["pyocr[indra]", "pyxberg", "setfitcv"]
text-embedding = ["clir"]
image-embedding = ["setfitcv"]
image-heads = ["setfitcv[train]"]
exif-location = ["setfitcv"]
face-detection = ["face[cuda]"]
contact-extraction = ["pyparse[contacts]"]
event-extraction = ["pyparse"]
gliner = ["pygliner"]
nerd = ["nerd"]
table-mapping = ["pytabular"]
# Everything at once (a full dev / all-in-one box).
cli = ["cipher-orchestration[staging,archive-extraction,text-extraction,ocr,text-embedding,image-embedding,face-detection,contact-extraction,event-extraction]"]
ner = ["cipher-orchestration[gliner,nerd]"]

[project.scripts]
cipher = "cipher.orchestration.cli:app"

[tool.uv.sources]
cipher-orchestration = { workspace = true }
cipher-schemas = { workspace = true }
cipher-datastores = { workspace = true }
cipher-places = { workspace = true }
cipher-utils = { workspace = true }
clir = { workspace = true }
filetyper = { workspace = true }
face = { workspace = true }
setfitcv = { workspace = true }
pyxberg = { workspace = true }
pyarchive = { workspace = true }
pyparse = { workspace = true }
pyselectors = { workspace = true }
pytabular = { workspace = true }
pyprompt = { workspace = true }
pyocr = { workspace = true }
pyvllm = { workspace = true }
pygliner = { workspace = true }
nerd = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]
