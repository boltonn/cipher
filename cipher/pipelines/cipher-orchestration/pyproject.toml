[project]
name = "cipher-orchestration"
version = "0.0.1"
description = "Workflow orchestration for cipher."
requires-python = ">=3.12"

dependencies = [
    "anyio",
    "cipher-schemas",
    "cipher-datastores[postgres,elasticsearch]",
    "cipher-utils",
    "loguru",
    "tqdm",
    "typer",
]

[project.optional-dependencies]
messages = ["clir", "numpy", "pandas"]
cli = ["filetyper", "face", "setfitcv", "pyxberg", "pyparse[email]", "pyselectors", "pyprompt", "clir"]
# Heavy NER model backends for `extract-entities --extractor gliner|nerd`; install
# alongside `cli` only in an environment that will run that stage.
ner = ["pygliner[relations]", "nerd"]

[project.scripts]
cipher = "cipher.orchestration.cli:app"

[tool.uv.sources]
cipher-schemas = { workspace = true }
cipher-datastores = { workspace = true }
cipher-utils = { workspace = true }
clir = { workspace = true }
filetyper = { workspace = true }
face = { workspace = true }
setfitcv = { workspace = true }
pyxberg = { workspace = true }
pyparse = { workspace = true }
pyselectors = { workspace = true }
pyprompt = { workspace = true }
pygliner = { workspace = true }
nerd = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]
