[project]
name = "cipher-names"
description = "Multilingual personal-name normalization, transliteration, phonetic keys, culture-aware parsing and comparison for CIPHER entity resolution."
keywords = ["names", "entity-resolution", "transliteration", "phonetic", "multilingual", "cipher"]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyascii",
    "jellyfish",
]

[project.optional-dependencies]
# Higher-quality transliteration via ICU. Needs the system `libicu` library.
# `translit` falls back to `anyascii` (then a built-in table) when this is absent.
icu = ["PyICU"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]

[tool.hatch.build.targets.wheel.force-include]
"src/cipher/names/data" = "cipher/names/data"
