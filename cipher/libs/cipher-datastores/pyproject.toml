[project]
name = "cipher-datastores"
description = "Datastore utilities and integrations for Cipher."
keywords = [ "unstructured" ]

version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "cipher-names",
    "cipher-schemas",
    "pydantic-settings",
]

[project.optional-dependencies]
elasticsearch = [ "elasticsearch==8.16" ]
postgres = [
  "asyncpg",
  "geoalchemy2",
  "pgvector",
  "psycopg2-binary",
  "shapely",
  "sqlalchemy[asyncio]",
  "sqlmodel"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]

[tool.uv.sources]
cipher-names = { workspace = true }
cipher-schemas = { workspace = true }