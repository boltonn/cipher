[project]
name = "cipher-utils"
description = "Common space for utilities for Cipher."
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "universal-pathlib>=0.3.10",
]

[project.optional-dependencies]
fastapi = [
    "aiohttp",
    "fastapi",
    "fastapi-offline",
    "python-multipart",
    "uvicorn[standard]",
    "uvloop",
]
aws = [
    "s3fs>=2026.4.0",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]
