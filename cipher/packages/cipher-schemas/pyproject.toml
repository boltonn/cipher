[project]
name = "cipher-schemas"
description = "Pydantic schemas for Cipher's data models and API contracts."
keywords = [ "unstructured" ]
version = "0.0.1"
requires-python = ">=3.12"

dependencies = [
    "loguru",
    "pydantic>=2",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]