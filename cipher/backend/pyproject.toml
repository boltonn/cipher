[project]
name = "cipher-backend"
version = "0.0.1"
description = "Main API service for Cipher"
requires-python = ">=3.12"

dependencies = [
    "cipher-datastores[postgres,elasticsearch]",
    "cipher-orchestration",
    "cipher-schemas",
    "cipher-utils[fastapi]",
    "clir",
    "face",
    "filetyper",
    "pyparse[email]",
    "pyselectors",
    "setfitcv",
    "httpx>=0.27",
    "pydantic-ai>=2.35.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cipher-datastores = { workspace = true }
cipher-orchestration = { workspace = true }
cipher-schemas = { workspace = true }
cipher-utils = { workspace = true }
clir = { workspace = true }
face = { workspace = true }
filetyper = { workspace = true }
pyparse = { workspace = true }
pyselectors = { workspace = true }
setfitcv = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]

[project.scripts]
cipher-serve = "cipher.api.main:main"